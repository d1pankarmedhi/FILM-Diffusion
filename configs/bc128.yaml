# Base Channels 128 (High Capacity) Configuration
model:
  in_channels: 1
  out_channels: 1
  time_emb_dim: 128
  text_emb_dim: 128
  base_channels: 128
  num_timesteps: 1000
  num_classes: 10

training:
  dataset: "fashion_mnist"
  batch_size: 128
  num_epochs: 50
  lr: 0.0001
  weight_decay: 0.0001
  cfg_dropout: 0.1
  guidance_scale: 7.5
  use_amp: true
  gradient_accumulation_steps: 1
  sample_interval: 5
  checkpoint_dir: "./checkpoints/bc128"

sampling:
  method: "ddim"
  num_inference_steps: 50
  eta: 0.0
  guidance_scale: 7.5
